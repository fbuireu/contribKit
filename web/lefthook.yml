pre-commit:
  commands:
    web-format:
      root: "web/"
      glob: "**/*.{ts,astro,css,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    web-verify:
      root: "web/"
      run: pnpm verify && pnpm lint:astro
