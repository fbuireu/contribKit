name = "contribkit"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-05-31"

[assets]
directory = "dist"
binding = "ASSETS"

[[send_email]]
name = "CONTACT_EMAIL"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["contribkit-web-production-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["contribkit-web-production-traces"]

[placement]
mode = "smart"

[env.production]
name = "contribkit"

[[env.production.routes]]
pattern = "contribkit.app"
custom_domain = true

[[env.production.routes]]
pattern = "www.contribkit.app"
custom_domain = true

[[env.production.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[env.production.ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[env.production.send_email]]
name = "CONTACT_EMAIL"

[env.production.observability]
enabled = true
redact_query_string = true

[env.production.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["contribkit-web-production-logs"]

[env.production.observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["contribkit-web-production-traces"]

[env.development]
name = "contribkit-development"

[[env.development.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

[[env.development.ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[env.development.send_email]]
name = "CONTACT_EMAIL"

[env.development.observability]
enabled = true
redact_query_string = true

[env.development.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["contribkit-web-development-logs"]

[env.development.observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["contribkit-web-development-traces"]
