name = "contribkit"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-05-31"

[assets]
directory = "dist"
binding = "ASSETS"

[env.production]
name = "contribkit"

[[env.production.routes]]
pattern = "contribkit.app"
custom_domain = true

[[env.production.routes]]
pattern = "www.contribkit.app"
custom_domain = true

[[env.production.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[env.development]
name = "contribkit-development"

[[env.development.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
