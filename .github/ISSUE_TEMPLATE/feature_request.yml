name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees: ['fbuireu']
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check [Discussions](../../discussions) to see whether it has been raised already.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: I would like the app to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
      placeholder: I also thought about...

  - type: textarea
    id: example
    attributes:
      label: Example Use Case
      description: How would you use this feature? Describe a concrete scenario or attach a mockup.
      placeholder: |
        As a user, I want to...
        So that I can...

  - type: checkboxes
    id: type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - label: New palette or color theme
        - label: New export format (PNG, SVG, Markdown...)
        - label: New calendar shape or style
        - label: GitHub data or visualization improvement
        - label: UI / UX improvement
        - label: Performance improvement
        - label: Accessibility improvement
        - label: Documentation improvement
        - label: Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, references, or any other context.
      placeholder: Any other relevant information...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute this feature?
      options:
        - label: I'm willing to submit a PR to implement this feature
