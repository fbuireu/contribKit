name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
assignees:
  - fbuireu
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check [IDEAS.md](../../blob/main/IDEAS.md) to see if it's already on the backlog.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "I find it frustrating when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, references, or any other context.
