name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: >-
          The GitHub Environment, namespaced <component>-<stage> per ADR 0001. The wrangler
          environment is the stage half, derived here rather than passed, so a caller cannot
          pair web-production with development.
      url:
        required: false
        type: string
      worker_name:
        required: false
        type: string
        description: Override the worker name (for per-PR preview deployments)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.worker_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Resolve the wrangler environment from the GitHub Environment
        id: stage
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "wrangler_env=${ENVIRONMENT##*-}" >> "$GITHUB_OUTPUT"
      - name: Refuse to build a Worker whose contact form can reach nobody
        env:
          CONTACT_DESTINATION: ${{ vars.CONTACT_DESTINATION }}
        run: |
          if [ -z "${CONTACT_DESTINATION}" ]; then
            echo "CONTACT_DESTINATION is empty, so every Contact Message would be refused with a 502 and nothing would say why" >&2
            exit 1
          fi
      - name: Build
        working-directory: web
        env:
          CLOUDFLARE_ENV: ${{ steps.stage.outputs.wrangler_env }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_DESTINATION: ${{ vars.CONTACT_DESTINATION }}
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
          PUBLIC_BETTER_STACK_TRACKING_TOKEN: ${{ vars.PUBLIC_BETTER_STACK_TRACKING_TOKEN }}
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        working-directory: web
        env:
          INPUTS_WORKER_NAME: ${{ inputs.worker_name }}
          WRANGLER_ENV: ${{ steps.stage.outputs.wrangler_env }}
          DEPLOY_MESSAGE: ${{ github.sha }}-${{ github.event_name }}
        run: |
          NAME_FLAG=""
          if [ -n "${INPUTS_WORKER_NAME}" ]; then
            NAME_FLAG="--name ${INPUTS_WORKER_NAME}"
          fi
          pnpm exec wrangler deploy --env "$WRANGLER_ENV" --message "$DEPLOY_MESSAGE" $NAME_FLAG
