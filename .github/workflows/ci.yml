name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
      cross_package: ${{ steps.filter.outputs.cross_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          APP_PATHS: '^app/'
          WEB_PATHS: '^(web/|shared/|scripts/|docs/|[^/]+[.]md$|package[.]json$|pnpm-workspace[.]yaml$|pnpm-lock[.]yaml$|lefthook[.]yml$|[.]github/)'
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'cross_package=false' >> "$GITHUB_OUTPUT"
            echo "::notice::No usable base commit, running everything."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          if printf '%s' "$changed" | grep -qE "$APP_PATHS"; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s' "$changed" | grep -qE "$WEB_PATHS"; then
            echo 'web=true' >> "$GITHUB_OUTPUT"
          else
            echo 'web=false' >> "$GITHUB_OUTPUT"
          fi
          mixed=$(printf '%s' "$changed" | grep -v '^app/assets/' || true)
          if printf '%s' "$mixed" | grep -qE '^app/' && printf '%s' "$mixed" | grep -qE '^web/'; then
            echo 'cross_package=true' >> "$GITHUB_OUTPUT"
            echo "::warning::This range touches both app and web. Releases are attributed by path, so a squash merge of this will appear in both changelogs. See docs/adr/0001."
          else
            echo 'cross_package=false' >> "$GITHUB_OUTPUT"
          fi

  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare web environment
        uses: ./.github/actions/prepare-env

      - name: Docs consistency
        run: pnpm test:docs
        working-directory: web

  app-ci:
    name: App
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    uses: ./.github/workflows/_ci-app.yml
    secrets: inherit

  web-ci:
    name: Web
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    uses: ./.github/workflows/_ci-web.yml
    secrets: inherit

  release:
    name: Semantic Release (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, web-ci]
    if: ${{ needs.changes.outputs.web == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Prepare web environment
        uses: ./.github/actions/prepare-env

      - name: Semantic Release
        id: release
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm exec semantic-release

  deploy-tail:
    name: Deploy the tail Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, web-ci]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: web-production
    defaults:
      run:
        working-directory: web/workers/tail
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare web environment
        uses: ./.github/actions/prepare-env

      - name: Collect the ingest token
        env:
          BETTER_STACK_INGESTING_URL: ${{ vars.PUBLIC_BETTER_STACK_INGESTING_URL }}
          BETTER_STACK_SOURCE_TOKEN: ${{ vars.PUBLIC_BETTER_STACK_SOURCE_TOKEN }}
          SECRETS_FILE: ${{ runner.temp }}/tail-secrets.json
        run: |
          if [ -z "$BETTER_STACK_INGESTING_URL" ]; then
            echo '::error::PUBLIC_BETTER_STACK_INGESTING_URL is not set on web-production.'
            exit 1
          fi
          if [ -z "$BETTER_STACK_SOURCE_TOKEN" ]; then
            echo '::error::PUBLIC_BETTER_STACK_SOURCE_TOKEN is not set on web-production.'
            exit 1
          fi
          node -e "
          const body = JSON.stringify({ BETTER_STACK_SOURCE_TOKEN: process.env.BETTER_STACK_SOURCE_TOKEN });
          require('node:fs').writeFileSync(process.env.SECRETS_FILE, body, { mode: 0o600 });
          "

      - name: Deploy to Cloudflare Workers
        env:
          BETTER_STACK_INGESTING_URL: ${{ vars.PUBLIC_BETTER_STACK_INGESTING_URL }}
          SECRETS_FILE: ${{ runner.temp }}/tail-secrets.json
        run: pnpm exec wrangler deploy --var "BETTER_STACK_INGESTING_URL:$BETTER_STACK_INGESTING_URL" --secrets-file "$SECRETS_FILE"

      - name: Remove the secrets file
        if: always()
        env:
          SECRETS_FILE: ${{ runner.temp }}/tail-secrets.json
        run: rm -f "$SECRETS_FILE"

  deploy-production:
    name: Deploy (Production)
    needs: [changes, web-ci, deploy-tail]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: web-production
      url: https://contribkit.app
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-development:
    name: Deploy (Development)
    needs: [changes, web-ci]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: web-development
      worker_name: pr-${{ github.event.pull_request.number }}-contribkit-development
      url: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Post preview URL
    needs: [changes, deploy-development]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      PREVIEW_MARKER: "<!-- web-preview-deployment -->"
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.PREVIEW_MARKER }}

      - name: Upsert preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PREVIEW_MARKER }}
            ### Web preview deployment

            | | |
            |---|---|
            | **URL** | ${{ env.PREVIEW_URL }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  e2e:
    name: E2E (preview)
    needs: [changes, deploy-development]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: web-development
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare web environment
        uses: ./.github/actions/prepare-env

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  cross-package-notice:
    name: Cross-package pull request
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.cross_package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      MARKER: '<!-- cross-package -->'
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.MARKER }}
      - name: Upsert cross-package comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.MARKER }}
            ### This pull request touches both packages

            Releases are attributed by the paths a commit touches, and `main` takes squash
            merges, so this will be listed in **both** the `app` and the `web` changelog,
            under whatever type the PR title carries.

            That is sometimes what you want (a change that genuinely spans both clients). If
            it is not, split it. See [ADR 0001](../blob/main/docs/adr/0001-monorepo-with-independently-released-components.md).

            This is advisory. It does not block the merge.

  check:
    name: Check
    needs: [changes, docs-contract, app-ci, web-ci, deploy-tail, deploy-development, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail if any job above did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
