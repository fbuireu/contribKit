name: CI Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/prepare-web-env/**"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/prepare-web-env/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-check:
    name: Check (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-web-env

      - name: Lint
        run: pnpm lint:all

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_SECRET }}
          files: ./web/coverage/lcov.info
          fail_ci_if_error: false

  web-build:
    name: Build (Web)
    runs-on: ubuntu-latest
    needs: [web-check]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-web-env

      - name: Build
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            cd web
            rm -rf node_modules/.astro/fonts
            pnpm exec astro build

      - name: Type check
        run: pnpm lint:astro

  release:
    name: Semantic Release (Web)
    runs-on: ubuntu-latest
    needs: [web-check, web-build]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: release
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm exec semantic-release

  deploy-production:
    name: Deploy (Production)
    needs: [web-check, web-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: web-production
      wrangler_env: production
      url: https://contribkit.app
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-development:
    name: Deploy (Development)
    needs: [web-check, web-build]
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: web-development
      wrangler_env: development
      worker_name: pr-${{ github.event.pull_request.number }}-contribkit-development
      url: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Post preview URL
    needs: [deploy-development]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PREVIEW_MARKER: "<!-- web-preview-deployment -->"
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.PREVIEW_MARKER }}

      - name: Upsert preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PREVIEW_MARKER }}
            ### Web preview deployment

            | | |
            |---|---|
            | **URL** | ${{ env.PREVIEW_URL }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

  e2e:
    name: E2E (preview)
    needs: [deploy-development]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    environment: web-development
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-web-env

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
