name: CI Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/prepare-web-env/**"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/prepare-web-env/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-check:
    name: Check (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-web-env

      - name: Lint
        run: pnpm lint:all

      - name: Test
        run: pnpm test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web/coverage/lcov.info
          fail_ci_if_error: true

  web-build:
    name: Build (Web)
    runs-on: ubuntu-latest
    needs: [web-check]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-web-env

      - name: Build
        run: pnpm exec astro build

      - name: Type check
        run: pnpm lint:astro

  release:
    name: Semantic Release (Web)
    runs-on: ubuntu-latest
    needs: [web-check, web-build]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: release
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm exec semantic-release

  deploy-production:
    name: Deploy (Production)
    needs: [web-check, web-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: web-production
      wrangler_env: production
      url: https://contribkit.app
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-development:
    name: Deploy (Development)
    needs: [web-check, web-build]
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: web-development
      wrangler_env: development
      worker_name: pr-${{ github.event.pull_request.number }}-contribkit-development
      url: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  comment:
    name: Post preview URL
    needs: [deploy-development]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PREVIEW_MARKER: "<!-- web-preview-deployment -->"
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-contribkit-development.fbuireu.workers.dev
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.PREVIEW_MARKER }}

      - name: Upsert preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.PREVIEW_MARKER }}
            ### Web preview deployment

            | | |
            |---|---|
            | **URL** | ${{ env.PREVIEW_URL }} |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |
