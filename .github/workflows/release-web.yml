name: Release Web

on:
  workflow_run:
    workflows: ["CI Web"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-web
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  deployments: write

jobs:
  release:
    name: Semantic Release (Web)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        id: release
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm exec semantic-release --extends semantic-release-monorepo

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.new_release_published == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/prepare-web-env

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        run: pnpm exec astro build

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=contribkit --branch=main
