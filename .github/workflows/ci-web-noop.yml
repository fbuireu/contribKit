name: CI Web (no-op)

# Companion to ci-web.yml: reports a passing "E2E (preview)" check on PRs that
# don't touch web paths, so the check can be required in the branch ruleset
# without deadlocking app-only or workflow-only PRs. The paths-ignore list must
# stay in sync with the paths list in ci-web.yml.
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/troubleshoot-workflows#handling-skipped-but-required-checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "shared/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/prepare-web-env/**"

permissions: {}

jobs:
  e2e:
    name: E2E (preview)
    runs-on: ubuntu-latest
    steps:
      - name: No web changes
        run: echo "No web paths changed in this PR - E2E (preview) not applicable."
