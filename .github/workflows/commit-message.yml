name: Commit Message

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint the title that becomes the commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-env

      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      cross_package: ${{ steps.filter.outputs.cross_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'cross_package=false' >> "$GITHUB_OUTPUT"
            echo "::notice::No usable base commit, skipping the cross-package check."
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -v '^app/assets/' || true)
          echo "$changed"
          if printf '%s' "$changed" | grep -qE '^app/' && printf '%s' "$changed" | grep -qE '^web/'; then
            echo 'cross_package=true' >> "$GITHUB_OUTPUT"
            echo "::warning::This range touches both app and web. Releases are attributed by path, so a squash merge of this will appear in both changelogs. See docs/adr/0001."
          else
            echo 'cross_package=false' >> "$GITHUB_OUTPUT"
          fi

  cross-package-notice:
    name: Cross-package pull request
    needs: [changes]
    if: ${{ needs.changes.outputs.cross_package == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      MARKER: '<!-- cross-package -->'
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.MARKER }}
      - name: Upsert cross-package comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ${{ env.MARKER }}
            ### This pull request touches both packages

            Releases are attributed by the paths a commit touches, and `main` takes squash
            merges, so this will be listed in **both** the `app` and the `web` changelog,
            under whatever type the PR title carries.

            That is sometimes what you want (a change that genuinely spans both clients). If
            it is not, split it. See [ADR 0001](../blob/main/docs/adr/0001-monorepo-with-independently-released-components.md).

            This is advisory. It does not block the merge.
