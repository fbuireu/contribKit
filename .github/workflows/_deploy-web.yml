name: Deploy Web (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: >-
          The GitHub Environment, namespaced <component>-<stage> per ADR 0001.
          The wrangler env is the stage half, derived here rather than passed,
          it used to be a second input, and nothing stopped a caller pairing
          web-production with development.
      url:
        required: false
        type: string
      worker_name:
        required: false
        type: string
        description: Override the worker name (for per-PR preview deployments)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-web-env

      - name: Resolve the wrangler environment from the GitHub Environment
        id: stage
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "wrangler_env=${ENVIRONMENT#web-}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          CLOUDFLARE_ENV: ${{ steps.stage.outputs.wrangler_env }}
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
          PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${{ vars.PUBLIC_BETTER_STACK_SOURCE_TOKEN }}
          PUBLIC_BETTER_STACK_INGESTING_URL: ${{ vars.PUBLIC_BETTER_STACK_INGESTING_URL }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            cd web
            rm -rf node_modules/.astro/fonts
            pnpm exec astro build

      - name: Deploy to Cloudflare Workers
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          INPUTS_WORKER_NAME: ${{ inputs.worker_name }}
          DEPLOY_MESSAGE: ${{ github.sha }} - ${{ github.event_name }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            cd web
            NAME_FLAG=""
            if [ -n "${INPUTS_WORKER_NAME}" ]; then
              NAME_FLAG="--name ${INPUTS_WORKER_NAME}"
            fi
            pnpm exec wrangler deploy $NAME_FLAG --message "$DEPLOY_MESSAGE"
