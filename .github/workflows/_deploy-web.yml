name: Deploy Web (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      wrangler_env:
        required: true
        type: string
      url:
        required: false
        type: string
      worker_name:
        required: false
        type: string
        description: Override the worker name (for per-PR preview deployments)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-web-env

      - name: Build
        env:
          CLOUDFLARE_ENV: ${{ inputs.wrangler_env }}
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
          PUBLIC_BETTER_STACK_SOURCE_TOKEN: ${{ vars.PUBLIC_BETTER_STACK_SOURCE_TOKEN }}
          PUBLIC_BETTER_STACK_INGESTING_URL: ${{ vars.PUBLIC_BETTER_STACK_INGESTING_URL }}
        run: pnpm exec astro build

      - name: Deploy to Cloudflare Workers
        env:
          INPUTS_WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          NAME_FLAG=""
          if [ -n "${INPUTS_WORKER_NAME}" ]; then
            NAME_FLAG="--name ${INPUTS_WORKER_NAME}"
          fi
          pnpm exec wrangler deploy $NAME_FLAG
