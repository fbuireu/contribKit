name: Release App

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track to publish to"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: release-app
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Semantic Release (App)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.detect.outputs.published }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: pnpm run release

      - name: Detect release
        id: detect
        run: |
          if git log -1 --pretty=%s | grep -q '^chore(release): app'; then
            VERSION=$(grep '^version:' app/pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Released app v$VERSION"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes — nothing to publish."
          fi

      - name: Update major version tag
        if: steps.detect.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'app-v*' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No app tag found; skipping major tag update."
            exit 0
          fi

          MAJOR_VERSION=$(echo "$LATEST_TAG" | sed -E 's/^(app-v[0-9]+).*/\1/')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -fa "$MAJOR_VERSION" -m "Update $MAJOR_VERSION to $LATEST_TAG"

          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git "$MAJOR_VERSION" --force

  deliver:
    name: Deliver to Google Play
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.published == 'true'
    environment: ${{ inputs.track == 'production' && 'app-production' || 'app-development' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "4.0.6"

      - name: Install fastlane
        working-directory: app/android
        run: bundle install

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Write signing config
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Write Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Sync shared assets
        run: cp ../shared/*.json assets/

      - name: Build release AAB
        env:
          REVENUECAT_KEY: ${{ secrets.REVENUECAT_KEY }}
        run: |
          printf '{"REVENUECAT_KEY":"%s"}' "$REVENUECAT_KEY" > dart-defines.json
          flutter build appbundle --release --dart-define-from-file=dart-defines.json

      - name: Generate Play release notes from changelog
        env:
          EXTRACT_VERSION_CODE: 's/.*\+([0-9]+).*/\1/'
          KEEP_LATEST_SECTION: '/^# / || /^## / { version_headers++; if (version_headers > 1) exit } { print }'
          DROP_VERSION_HEADER: '1d'
          FLATTEN_SUBHEADINGS: 's/^### +//'
          UNWRAP_MARKDOWN_LINKS: 's/\[([^]]+)\]\([^)]+\)/\1/g'
          STRIP_BOLD_MARKERS: 's/\*\*([^*]+)\*\*/\1/g'
          BULLETIZE_LIST_ITEMS: 's/^\* /• /'
          STRIP_COMMIT_HASHES: 's/ \([0-9a-f]{7,}\)//g'
          DROP_BLANK_LINES: '/^[[:space:]]*$/d'
          GOOGLE_PLAY_NOTES_MAX_CHARS: "500"
        run: |
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed -E "$EXTRACT_VERSION_CODE")
          if [ -z "$VERSION_CODE" ] || [ ! -f CHANGELOG.md ]; then
            echo "No version code or CHANGELOG.md found; leaving release notes untouched." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NOTES=$(awk "$KEEP_LATEST_SECTION" CHANGELOG.md \
            | sed -E "$DROP_VERSION_HEADER" \
            | sed -E "$FLATTEN_SUBHEADINGS" \
            | sed -E "$UNWRAP_MARKDOWN_LINKS" \
            | sed -E "$STRIP_BOLD_MARKERS" \
            | sed -E "$BULLETIZE_LIST_ITEMS" \
            | sed -E "$STRIP_COMMIT_HASHES" \
            | sed -E "$DROP_BLANK_LINES")
          NOTES=$(printf '%s' "$NOTES" | head -c "$GOOGLE_PLAY_NOTES_MAX_CHARS")
          if [ -z "$NOTES" ]; then
            echo "Empty notes after parsing; leaving release notes untouched." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEST=android/fastlane/metadata/android/en-US/changelogs
          mkdir -p "$DEST"
          printf '%s\n' "$NOTES" > "$DEST/${VERSION_CODE}.txt"
          echo "Release notes for versionCode ${VERSION_CODE}:"
          cat "$DEST/${VERSION_CODE}.txt"
          {
            echo "### 📝 Google Play release notes — versionCode ${VERSION_CODE}"
            echo '```text'
            cat "$DEST/${VERSION_CODE}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Google Play
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            cd app/android
            bundle exec fastlane deploy track:"${{ inputs.track }}"
