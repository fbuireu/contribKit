name: Release App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

concurrency:
  group: release-app
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Semantic Release (App)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Install app release tooling
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: pnpm run release

      - name: Update major version tag
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'app-v*' 2>/dev/null || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No app tag found; skipping major tag update."
            exit 0
          fi

          MAJOR_VERSION=$(echo "$LATEST_TAG" | sed -E 's/^(app-v[0-9]+).*/\1/')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -fa "$MAJOR_VERSION" -m "Update $MAJOR_VERSION to $LATEST_TAG"

          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git "$MAJOR_VERSION" --force
