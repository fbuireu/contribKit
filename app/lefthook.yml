pre-commit:
  parallel: true
  commands:
    flutter-format:
      root: "app/"
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    dart-analyze:
      root: "app/"
      glob: "*.dart"
      run: dart analyze --fatal-infos

pre-push:
  parallel: false
  commands:
    dart-analyze:
      root: "app/"
      glob:
        - "*.dart"
        - "pubspec.yaml"
        - "analysis_options.yaml"
      run: dart analyze --fatal-infos
    flutter-test:
      root: "app/"
      glob:
        - "*.dart"
        - "pubspec.yaml"
        - "analysis_options.yaml"
      run: flutter test --coverage && dart run tool/check_coverage.dart
