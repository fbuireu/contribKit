name: contribkit
description: Visualize and export GitHub contribution calendars with full visual customization.
publish_to: none
version: 1.2.5+26

environment:
  sdk: 3.12.1
  flutter: 3.44.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2

  # Serialization / freezed
  freezed_annotation: 3.1.0
  json_annotation: 4.11.0

  # Networking
  http: 1.6.0

  # Persistence
  hive_flutter: 1.1.0

  # Sharing / export
  share_plus: 13.1.0

  # Home screen widget + background refresh
  home_widget: 0.9.2
  workmanager: 0.9.0
  path_provider: 2.1.5

  # UI primitives
  shadcn_ui: 0.54.0
  flutter_animate: 4.5.2

  # Splash screen
  flutter_native_splash: 2.4.8

  # In-app purchases
  purchases_flutter: 10.2.0
  purchases_ui_flutter: 10.2.0

  # Fonts
  google_fonts: 8.1.0

  # Internationalisation
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # App icon generation
  flutter_launcher_icons: 0.14.4

  # Code generation
  build_runner: 2.15.0
  riverpod_generator: 4.0.4
  freezed: 3.2.5
  json_serializable: 6.13.0

  # Linting
  flutter_lints: 6.0.0
  riverpod_lint: 3.1.4

  # Testing
  mocktail: 1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: false

  assets:
    - assets/images/
    - assets/palettes.json
    - assets/shapes.json
    - assets/usernames.json
