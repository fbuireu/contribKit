name: contribkit
description: Visualize and export GitHub contribution calendars with full visual customization.
publish_to: none
version: 1.3.0+28

environment:
  sdk: 3.13.0
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 3.4.2
  riverpod_annotation: 4.0.6

  # Serialization / freezed
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  # Networking
  http: 1.6.0

  # Persistence
  hive_flutter: 1.1.0

  # Sharing / export
  share_plus: 13.3.0

  # Home screen widget + background refresh
  home_widget: 0.9.3
  workmanager: 0.10.7
  path_provider: 2.1.6

  # UI primitives
  shadcn_ui: 0.56.1
  flutter_animate: 4.5.2

  # Splash screen
  flutter_native_splash: 2.4.8

  # In-app purchases
  purchases_flutter: 10.8.0
  purchases_ui_flutter: 10.8.0

  # Fonts
  google_fonts: 8.2.1

  # Internationalisation
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # App icon generation
  flutter_launcher_icons: 0.14.4

  # Code generation
  build_runner: 2.16.0
  riverpod_generator: 4.0.8
  freezed: 4.0.0-dev.3
  json_serializable: 6.14.1

  # Linting
  flutter_lints: 6.0.0
  riverpod_lint: 3.1.8

  # Testing
  mocktail: 1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: false

  assets:
    - assets/images/
    - assets/palettes.json
    - assets/shapes.json
    - assets/usernames.json
