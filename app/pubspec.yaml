name: contribkit
description: Visualize and export GitHub contribution calendars with full visual customization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Serialization / freezed
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  http: ^1.6.0

  # Persistence
  hive_flutter: ^1.1.0

  # Sharing / export
  share_plus: ^13.1.0

  # Home screen widget + background refresh
  home_widget: ^0.7.0
  workmanager: ^0.9.0
  path_provider: ^2.1.0

  # UI primitives
  shadcn_ui: ^0.54.0
  flutter_animate: ^4.5.0

  # Splash screen
  flutter_native_splash: ^2.4.0

  # In-app purchases
  purchases_flutter: ^10.1.0
  purchases_ui_flutter: ^10.1.0

  # Fonts
  google_fonts: ^8.1.0

  # Internationalisation
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

  # Linting
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.0

  # Testing
  mocktail: ^1.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/images/
