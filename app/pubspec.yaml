name: contribkit
description: Visualize and export GitHub contribution calendars with full visual customization.
publish_to: none
version: 1.6.0+38

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7

  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  http: 1.6.0

  hive_flutter: 1.1.0

  share_plus: 13.3.0

  home_widget: 0.9.4
  workmanager: 0.10.10

  shadcn_ui: 0.56.3
  flutter_animate: 4.5.2

  flutter_native_splash: 2.4.8

  purchases_flutter: 10.8.0

  sentry_flutter: 9.30.0
  posthog_flutter: 5.40.1

  google_fonts: 8.2.1

  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: 0.14.4

  build_runner: 2.16.1
  riverpod_generator: 4.0.9
  freezed: 4.0.2
  json_serializable: 6.14.1

  sentry_dart_plugin: 3.4.0

  flutter_lints: 6.0.0
  riverpod_lint: 3.1.9

  mocktail: 1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: false

  assets:
    - assets/images/
    - assets/palettes.json
    - assets/shapes.json
    - assets/usernames.json

sentry:
  upload_debug_symbols: true
  upload_sources: true
  symbols_path: build/symbols
