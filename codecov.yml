codecov:
  require_ci_to_pass: false

flags:
  app:
    paths:
      - app/lib/
    carryforward: true
  web:
    paths:
      - web/src/
    carryforward: true

coverage:
  status:
    project:
      default: false
      app:
        flags:
          - app
        target: auto
        threshold: 1%
        informational: true
      web:
        flags:
          - web
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "flags, files"
  require_changes: true
